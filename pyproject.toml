[project]
name = "mokkoji-rag"
version = "0.1.0"
description = "모꼬지 노션 문서 RAG 챗봇"
requires-python = ">=3.11"
dependencies = [
    "notion-client>=2.2.1",
    # docker-compose.yml의 Qdrant 이미지 태그와 메이저·마이너를 맞춘다. 어긋나면 클라이언트가 경고한다.
    "qdrant-client>=1.12,<1.14",
    "FlagEmbedding>=1.3.2",
    "langchain>=1.0.0",
    "langchain-qdrant>=1.0.0",
    "langchain-ollama>=1.0.0",
    "discord.py>=2.4.0",
    "python-dotenv>=1.0.1",
    "tqdm>=4.67.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]
